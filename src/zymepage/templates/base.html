<!doctype html>
<!-- ZymePage web interface -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ZymePage registry catalog for ZymeForge">
    <title>{% block title %}ZymePage{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <script defer src="{{ url_for('static', path='app.js') }}"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/tools" aria-label="ZymePage registry catalog">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 44 44" role="img"><path d="M7 28c5-1 8-4 10-9m-6-6c6 1 10 4 12 9m14-9c-6 1-10 5-12 11m12 8c-7 0-12-3-15-8m0 0v13m0-13C15 25 9 22 6 17m16 7c6 0 11-2 15-6"/><circle cx="11" cy="13" r="2"/><circle cx="37" cy="13" r="2"/><circle cx="37" cy="32" r="2"/><circle cx="6" cy="17" r="2"/><circle cx="22" cy="37" r="2"/></svg>
        </span>
        <span>ZymePage</span>
      </a>
      <nav class="main-nav" aria-label="Primary navigation">
        <a class="{% if page == 'tools' %}active{% endif %}" href="/tools">Registry catalog</a>
        <a class="{% if page == 'harness' %}active{% endif %}" href="/harness">Harness</a>
        <a href="/api/docs">API</a>
        <a href="{{ docs_url }}">Docs</a>
      </nav>
      <a class="github-link" href="https://github.com/Gabriel-QIN/ZymeForge_docs" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C16 6 17 6.3 17 6.3c.6 1.5.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.2v3.2c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"/></svg>
        GitHub
      </a>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <span>ZymePage · ZymeForge registry catalog</span>
      <span>Sequence · Structure · Function · Engineering</span>
    </footer>
  </body>
</html>
