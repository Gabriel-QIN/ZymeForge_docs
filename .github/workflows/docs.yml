name: ZymeForge Documentation

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --index-url https://pypi.org/simple ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: Explain one-time Pages setup
        if: steps.pages.outcome == 'failure'
        run: |
          echo "## GitHub Pages must be enabled once" >> "$GITHUB_STEP_SUMMARY"
          echo "Open **Settings → Pages → Build and deployment** and set **Source** to **GitHub Actions**, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy documentation
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v5
